! Publication copy: feature-relevant configuration only.
hostname R1
!
interface GigabitEthernet0/0
 description Routed link to DSW1 Gi1/0
 no shutdown
 ip address 192.168.0.6 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
!
interface GigabitEthernet0/1
 description Routed link to DSW2 Gi1/0
 no shutdown
 ip address 192.168.0.10 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
!
interface GigabitEthernet0/2
 description Routed link to Firewall inside Ethernet2
 no shutdown
 ip address 192.168.0.1 255.255.255.252
 ip ospf 1 area 0
!
router ospf 1
 router-id 3.3.3.3
