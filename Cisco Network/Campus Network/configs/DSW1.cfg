! Publication copy: feature-relevant configuration only.
hostname DSW1
!
vlan 10
vlan 20
vlan 30
vlan 40
vlan 100
!
ip dhcp excluded-address 192.168.1.254
ip dhcp excluded-address 192.168.1.253
ip dhcp excluded-address 192.168.2.254
ip dhcp excluded-address 192.168.2.253
ip dhcp excluded-address 192.168.3.254
ip dhcp excluded-address 192.168.3.253
ip dhcp excluded-address 192.168.4.254
ip dhcp excluded-address 192.168.4.253
ip dhcp excluded-address 192.168.1.100
ip dhcp excluded-address 192.168.2.100
ip dhcp excluded-address 192.168.3.100
ip dhcp excluded-address 192.168.4.100
!
ip dhcp pool VLAN10
 network 192.168.1.0 255.255.255.0
 default-router 192.168.1.100
 dns-server 8.8.8.8
!
ip dhcp pool VLAN20
 network 192.168.2.0 255.255.255.0
 default-router 192.168.2.100
 dns-server 8.8.8.8
!
ip dhcp pool VLAN30
 network 192.168.3.0 255.255.255.0
 default-router 192.168.3.100
 dns-server 8.8.8.8
!
ip dhcp pool VLAN40
 network 192.168.4.0 255.255.255.0
 default-router 192.168.4.100
 dns-server 8.8.8.8
!
spanning-tree mode rapid-pvst
!
interface GigabitEthernet0/0
 description Trunk to SW1 Gi0/0
 no shutdown
 switchport trunk encapsulation dot1q
 switchport mode dynamic desirable
 switchport trunk native vlan 100
 switchport trunk allowed vlan 10,20,30,40
!
interface GigabitEthernet0/1
 description Trunk to SW2 Gi0/0
 no shutdown
 switchport trunk encapsulation dot1q
 switchport mode dynamic desirable
 switchport trunk native vlan 100
 switchport trunk allowed vlan 10,20,30,40
!
interface GigabitEthernet0/2
 description Trunk to SW3 Gi0/0
 no shutdown
 switchport trunk encapsulation dot1q
 switchport mode dynamic desirable
 switchport trunk native vlan 100
 switchport trunk allowed vlan 10,20,30,40
!
interface GigabitEthernet0/3
 description Trunk to SW4 Gi0/0
 no shutdown
 switchport trunk encapsulation dot1q
 switchport mode dynamic desirable
 switchport trunk native vlan 100
 switchport trunk allowed vlan 10,20,30,40
!
interface GigabitEthernet1/0
 description Routed uplink to R1 Gi0/0
 no shutdown
 no switchport
 ip address 192.168.0.5 255.255.255.252
 ip ospf network point-to-point
 ip ospf 1 area 0
!
interface Vlan10
 no shutdown
 ip address 192.168.1.254 255.255.255.0
 standby 1 ip 192.168.1.100
 standby 1 priority 110
 standby 1 preempt
 ip ospf network broadcast
 ip ospf 1 area 0
!
interface Vlan20
 no shutdown
 ip address 192.168.2.254 255.255.255.0
 standby 1 ip 192.168.2.100
 standby 1 priority 110
 standby 1 preempt
 ip ospf network broadcast
 ip ospf 1 area 0
!
interface Vlan30
 no shutdown
 ip address 192.168.3.254 255.255.255.0
 standby 1 ip 192.168.3.100
 standby 1 preempt
 ip ospf network broadcast
 ip ospf 1 area 0
!
interface Vlan40
 no shutdown
 ip address 192.168.4.254 255.255.255.0
 standby 1 ip 192.168.4.100
 standby 1 preempt
 ip ospf network broadcast
 ip ospf 1 area 0
!
router ospf 1
 router-id 1.1.1.1
